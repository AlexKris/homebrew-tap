name: Bump mihomo-sparkle

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get latest upstream version
        id: up
        run: |
          RELEASE=$(curl -fsSL https://api.github.com/repos/xishang0128/sparkle/releases/latest)
          echo "$RELEASE" > release.json

          V=$(jq -r '.tag_name' release.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Get current cask version
        id: cur
        run: |
          C=$(grep -E '^\s*version "' Casks/mihomo-sparkle.rb | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$C" >> "$GITHUB_OUTPUT"

      - name: Show versions
        run: |
          echo "upstream: ${{ steps.up.outputs.version }}"
          echo "current:  ${{ steps.cur.outputs.version }}"

      - name: Compute new sha256
        id: sha
        if: steps.up.outputs.version != steps.cur.outputs.version
        run: |
          ARM_URL=$(jq -r '.assets[].browser_download_url | select(test("arm64.*\\.pkg$"))' release.json | head -1)
          X64_URL=$(jq -r '.assets[].browser_download_url | select(test("(x64|amd64).*\\.pkg$"))' release.json | head -1)

          echo "arm_url=$ARM_URL" >> "$GITHUB_OUTPUT"
          echo "x64_url=$X64_URL" >> "$GITHUB_OUTPUT"

          test -n "$ARM_URL"
          test -n "$X64_URL"

          ARM=$(curl -fsSL "$ARM_URL" | sha256sum | awk '{print $1}')
          X64=$(curl -fsSL "$X64_URL" | sha256sum | awk '{print $1}')

          echo "arm=$ARM" >> "$GITHUB_OUTPUT"
          echo "x64=$X64" >> "$GITHUB_OUTPUT"

      - name: Patch cask file
        if: steps.up.outputs.version != steps.cur.outputs.version
        env:
          NEW: ${{ steps.up.outputs.version }}
          OLD: ${{ steps.cur.outputs.version }}
          ARM: ${{ steps.sha.outputs.arm }}
          X64: ${{ steps.sha.outputs.x64 }}
        run: |
          F=Casks/mihomo-sparkle.rb
          sed -i -E "s|version \"$OLD\"|version \"$NEW\"|" "$F"
          sed -i -E "s|(arm:[[:space:]]+)\"[a-f0-9]{64}\"|\1\"$ARM\"|" "$F"
          sed -i -E "s|(intel:[[:space:]]+)\"[a-f0-9]{64}\"|\1\"$X64\"|" "$F"
          echo "--- diff ---"
          git diff -- "$F"

      - name: Commit & push
        if: steps.up.outputs.version != steps.cur.outputs.version
        env:
          NEW: ${{ steps.up.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Casks/mihomo-sparkle.rb

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit"
            exit 0
          fi

          git commit -m "mihomo-sparkle: bump to $NEW"
          git push